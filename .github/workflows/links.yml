name: Check links

on:
  pull_request:
    branches: [main]
  schedule:
    # Monthly sweep for link rot on the 8th.
    - cron: "0 6 8 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Check the rendered site so generated links are covered too.
          # noahweidig.com links are checked live (some are separate
          # project-pages repos, not part of this site's render).
          # Accepted codes: 403/429 (bot blocking), 405 (Formspree POST
          # endpoint), 415 (oakfirescience.com's WAF rejects the CI request
          # though the page loads 200 in a browser), 999 (LinkedIn).
          # Excluded hosts have TLS setups rustls can't negotiate, or reset
          # the connection outright: the UF library's thesis repository
          # (original-ufdc.uflib.ufl.edu) serves the linked PDF fine in a
          # browser but resets CI's connection, and returns 403 to anything
          # that is not one.
          # `--remap` undoes the `/quarto-portfolio` prefix `--root-dir`
          # would otherwise bake into every absolute link's resolved path:
          # the site's own hrefs carry it (see scripts/site-output.ts's
          # `basePath`, for the real GitHub Pages URL), but `_site` on disk
          # here has no such subdirectory. Matches the already-resolved
          # `file://` URI, since lychee applies `--root-dir` before `--remap`.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --remap '^file://${{ github.workspace }}/_site/quarto-portfolio(/.*)?$ file://${{ github.workspace }}/_site$1'
            --accept '100..=103,200..=299,403,405,415,429,999'
            --exclude 'ecos\.fws\.gov'
            --exclude 'victoriamdonovan\.org'
            --exclude 'original-ufdc\.uflib\.ufl\.edu'
            '_site/**/*.html'
          fail: true
