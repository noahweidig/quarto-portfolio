name: Publish website

on:
  push:
    branches: [main]
  # Render-only check for PRs so a broken site never reaches main.
  pull_request:
    branches: [main]
  # Called by update-pubs.yml after the Zotero sync commits new publications.
  # Pushes made with GITHUB_TOKEN don't fire `push` workflows, so without this
  # the bot's commit sits on main undeployed until someone happens to push
  # (#247). A `workflow_call` keeps the deploy inside the sync's own run — it
  # fails there if it fails — and avoids the `workflow_run` + checkout-a-ref
  # pattern, which grants write credentials to a checkout of code the trigger
  # doesn't control.
  workflow_call:
  workflow_dispatch:

# Least privilege at the workflow level: only the deploy job needs to write
# to Pages, and the build job checks out PR code from forks — so it runs with
# read-only credentials.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  # Cancel superseded PR render checks, but never a production deploy: killing
  # a run mid-`deploy-pages` cancels the Pages deployment it is waiting on
  # (that is where the "Deployment cancelled" failures came from), and the
  # queued replacement then inherits a half-finished deployment. Production
  # runs queue instead, so each deployment finishes before the next starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Quarto pin lives in .quarto-version, which .github/actions/build-site
  # reads. netlify.toml has to repeat it (Netlify can't read a file to build
  # its install command), so the two are compared here rather than trusted to
  # stay in step by hand (#249).
  quarto-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check netlify.toml matches .quarto-version
        run: ./scripts/check-quarto-pin.sh

  # Every other gate in this repo checks the *output* — html-validate, axe and
  # Lighthouse all run against rendered pages. This one checks the input: the
  # ~5,500 lines of hand-written CSS, SCSS and JS that nothing else reads
  # (#267), and — through `lint:prose` — the writing itself, which nothing
  # checked at all (#250). Same `npm ci --ignore-scripts` as the build job, for the same
  # reason: none of these three needs a lifecycle script.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install toolchain
        run: npm ci --ignore-scripts
      - name: Lint sources
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No `ref:` — every event that reaches this workflow (push, PR,
      # dispatch, and the sync's workflow_call) checks out its own ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build site
        uses: ./.github/actions/build-site

      # The generated markup — six EJS templates plus three post-render
      # scripts that rewrite tags — is the part nothing else inspects, and
      # a duplicate id or a malformed srcset is invisible to every other
      # check here (#256). Runs against the same _site that ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: html-validate needs no lifecycle script, and an
      # install that runs them is arbitrary code execution on the runner.
      - name: Install toolchain
        run: npm ci --ignore-scripts

      - name: Validate HTML
        run: npm run validate:html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # The action's default is 10 minutes, after which it gives up AND
          # cancels the deployment it was polling. Pages holds a deployment in
          # `deployment_in_progress` well past that whenever it is also syncing
          # the custom domain or (re)issuing the domain's TLS certificate — the
          # content is already served by then, so aborting throws away a
          # deployment that had effectively succeeded. 25 minutes covers the
          # domain-sync case; a deployment genuinely stuck still fails, just
          # later. Kept under the job's 30-minute cap so the action reports the
          # timeout itself instead of the runner killing the job.
          timeout: 1500000
