name: Accessibility (axe)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same build as publish.yml, cwebp included, so axe audits the site
      # with the responsive image variants that actually ship (#249).
      - name: Build site
        uses: ./.github/actions/build-site

      # Lifecycle scripts stay off (SonarCloud flags implicit script
      # execution on install); puppeteer's postinstall is what fetches its
      # matched Chromium build, so it is re-run explicitly — a script we know
      # we asked for, at the version package-lock.json pins.
      - name: Install toolchain
        run: |
          npm ci --ignore-scripts
          node ./node_modules/puppeteer/install.mjs

      - name: Run axe-core
        run: npm run a11y
