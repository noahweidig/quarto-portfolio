format:
  html:
    grid:
      body-width: 1150px
    theme:
      # _tokens.scss first: it declares every design primitive (the --nw-*
      # custom properties); theme.scss consumes them and the theme files
      # override the color layer only. See #222.
      dark: [cosmo, assets/_tokens.scss, assets/theme.scss, assets/theme-dark.scss]
      light: [cosmo, assets/_tokens.scss, assets/theme.scss, assets/theme-light.scss]
    css: assets/site.css
    lightbox: auto
    include-after-body:
      - text: |
          <script src="/assets/nw-nav.js"></script>
          <script src="/assets/social-share.js"></script>
    toc: false
    anchor-sections: false
    # No page on the site uses LaTeX math, but Quarto still ships MathJax
    # (285 KiB from jsDelivr) plus a render-blocking ES6 polyfill on listing
    # pages. `plain` drops both; re-enable mathjax if a post ever needs math.
    html-math-method: plain
    link-external-newwindow: true
    lang: en
    include-in-header:
      - text: |
          <!--
            The single theme-color tag. It carries no `media` attribute on
            purpose: the site's theme is chosen by the toggle (which writes
            `quarto-color-scheme` to localStorage and swaps stylesheets), not
            by prefers-color-scheme, so a media-keyed pair would leave the
            browser chrome showing the OS theme while the page shows the
            toggled one (#234). The script below stamps the right value before
            paint; assets/nw-nav.js rewrites it on every toggle. The two values
            are --nw-bg in theme-light.scss / theme-dark.scss.
          -->
          <meta name="theme-color" content="#fcfcfb">
          <script>
          (function () {
            // First visit only (no saved toggle choice yet): seed Quarto's
            // localStorage key from the OS preference before Quarto's own
            // body-start script reads it, so light-preference visitors don't
            // get dark by default. Runs before paint to avoid a flash.
            // See https://github.com/noahweidig/noahweidig.github.io/issues/177
            var scheme = null;
            try {
              scheme = window.localStorage.getItem("quarto-color-scheme");
              if (
                scheme === null &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ) {
                scheme = "light";
                window.localStorage.setItem("quarto-color-scheme", "light");
              }
            } catch (e) {}
            // Same pass, same source of truth: stamp the browser chrome to
            // match the theme this page is about to render in, so the address
            // bar never flashes the wrong color (#234). A null sentinel means
            // no stored choice and no light OS preference, i.e. dark.
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute(
                "content",
                scheme === "dark" || scheme === null ? "#0b0d12" : "#fcfcfb"
              );
            }
          })();
          </script>
          <meta name="google-site-verification" content="0ktlvQnqLH01fphPI1cDMDTuQSmCG7mHBQdovXQs2TQ">
          <meta name="author" content="Noah Weidig">
          <!--
            `index, follow` is the default anyway; the value that earns this tag
            is max-image-preview:large, which lets Google show the full-width
            image preview in results and Discover instead of a thumbnail.
            scripts/generate-og.ts overwrites this tag on 404.html, the one page
            that must stay out of the index.
          -->
          <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
          <!--
            Speculation rules: start fetching a page when the visitor shows
            intent to open it (hover, or the pause before a tap), so the
            document is already in memory by the time they commit. Paired with
            the cross-document view transitions in assets/site.css, an internal
            navigation becomes a morph with no load behind it.

            `prefetch` rather than `prerender` on purpose: prerendering runs the
            target page's scripts ahead of time, and this site's analytics fire
            on load — a prerender that is never navigated to would still be a
            page it counted. Prefetch has no such interaction, is invisible to
            the target document, and still removes the whole network round trip,
            which is the part the visitor can feel.

            Downloads and the résumé PDF are excluded: they navigate away from
            the site, so speculating on them is wasted bandwidth. Browsers
            without support ignore the script entirely.
          -->
          <script type="speculationrules">
          {
            "prefetch": [
              {
                "where": {
                  "and": [
                    { "href_matches": "/*" },
                    { "not": { "href_matches": "/uploads/*" } }
                  ]
                },
                "eagerness": "moderate"
              }
            ]
          }
          </script>
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Person",
                "@id": "https://noahweidig.com/quarto-portfolio/#person",
                "name": "Noah Weidig",
                "url": "https://noahweidig.com/quarto-portfolio/",
                "image": "https://noahweidig.com/quarto-portfolio/assets/media/authors/me.webp",
                "jobTitle": "GIS Analyst & Data Scientist",
                "email": "mailto:noah@noahweidig.com",
                "alumniOf": [
                  { "@type": "CollegeOrUniversity", "name": "University of Florida", "url": "https://www.ufl.edu/" },
                  { "@type": "CollegeOrUniversity", "name": "Northern Kentucky University", "url": "https://www.nku.edu/" }
                ],
                "knowsAbout": ["GIS", "Remote Sensing", "Spatial Data Science", "Ecology", "Data Visualization", "Machine Learning"],
                "sameAs": [
                  "https://www.linkedin.com/in/noahweidig/",
                  "https://github.com/noahweidig/",
                  "https://scholar.google.com/citations?hl=en&user=Ml95eTwAAAAJ",
                  "https://orcid.org/0000-0003-1205-3209"
                ]
              },
              {
                "@type": "WebSite",
                "@id": "https://noahweidig.com/quarto-portfolio/#website",
                "url": "https://noahweidig.com/quarto-portfolio/",
                "name": "Noah Weidig",
                "description": "Noah Weidig is an ecologist and GIS analyst specializing in geospatial data science, environmental modeling, and large-scale spatial analysis.",
                "publisher": { "@id": "https://noahweidig.com/quarto-portfolio/#person" }
              }
            ]
          }
          </script>
          <link rel="alternate" type="application/rss+xml" title="Noah Weidig — Blog" href="/blog/index.xml">
          <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/newsreader-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="icon" href="/favicon.ico" sizes="32x32">
          <link rel="icon" type="image/svg+xml" href="/favicon.svg">
          <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
          <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
          <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0076DF">
          <link rel="manifest" href="/site.webmanifest">

execute:
  freeze: true
