project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    # Netlify installs Quarto by extracting the release tarball into the repo
    # (quarto-<version>/). Exclude it so Quarto never tries to render the
    # template .qmd files bundled inside its own installation.
    - "!quarto-*/**"
  # After every render: sync the hero "Featured Projects" stat with the
  # projects that actually have `featured: true` (scripts/update-stats.ts),
  # then regenerate the per-page Open Graph PNG cards plus the canonical/social
  # <head> tags (scripts/generate-og.ts), and finally stamp intrinsic image
  # dimensions, lazy-loading and responsive srcsets onto the rendered pages,
  # take the inactive theme's CSS off the critical path, and align sitemap.xml
  # with the canonical URLs (scripts/optimize-output.ts). Order matters: the
  # last two both rewrite the HTML generate-og.ts produced.
  post-render:
    - scripts/update-stats.ts
    # Rebuilds the 404 page's destination cards from the navbar below, so the
    # list can't go stale when a section is added, renamed or removed.
    - scripts/build-404.ts
    # Gives every main page (section indexes plus the root-level pages) the
    # 404 page's centered header: kicker label above the title, centered
    # subtitle below it. Quarto's title-block template has no slot above the
    # <h1>, so the kicker is stamped into the rendered HTML here.
    - scripts/page-headers.ts
    - scripts/generate-og.ts
    - scripts/optimize-output.ts
  resources:
    - robots.txt
    - favicon.ico
    - favicon.svg
    - safari-pinned-tab.svg
    - favicon-96x96.png
    - apple-touch-icon.png
    - site.webmanifest
    - web-app-manifest-192x192.png
    - web-app-manifest-512x512.png
    - "uploads/**"
    # The publication PDFs pulled from Zotero by scripts/update-pubs.js. The
    # listing page links them from the EJS template, which Quarto's resource
    # discovery doesn't follow.
    - "publications/**/*.pdf"
    - "assets/media/**"
    - "assets/fonts/**"
    - assets/nw-nav.js
    - assets/social-share.js
    # Referenced root-relative from contact.qmd's include-after-body, which
    # Quarto's resource discovery doesn't follow — must be listed explicitly.
    - assets/contact-form.js
    # Same for 404.qmd's include-after-body.
    - assets/notfound.js

filters:
  - social-share
  - code-window
  # Turns code blocks tagged `.webr` into live, editable R cells that run in
  # the reader's browser via WebAssembly. No-ops on pages without such cells.
  - webr
  # Prepends "X minute read" to blog post pages (Quarto's own reading-time
  # estimate exists only for listing items). No-ops outside blog/*/.
  - scripts/reading-time.lua

